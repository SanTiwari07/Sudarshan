services:
  # ── 1. Frontend Analyst Dashboard (React 18 SPA) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudarshan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      # Force chokidar (Vite's file watcher) into polling mode on Windows/WSL2
      # bind-mount volumes. Without this, inotify events fail with EIO when
      # the /app bind-mount path becomes momentarily unavailable and crash the
      # entire Vite dev server process (Node.js uncaught FSWatcher error).
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # ── 2. Backend Gateway Orchestrator (FastAPI & Case Store) ─────────────────
  backend:
    build:
      # Repo root, so the build can reach shared/ as well as backend/
      context: .
      dockerfile: backend/Dockerfile
    container_name: sudarshan-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app:/opt/sudarshan-core
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8001
      - MOBSF_HOST=http://mobsf:8000
      - MOBSF_API_KEY=sudarshan_mobsf_api_key_2026
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5555
      - UPLOADS_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./shared:/opt/sudarshan-core
      - ./.env:/app/.env:ro
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      analysis-engine:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. Analysis Engine Container (Ubuntu 24.04 + Java 17 + Python 3.12) ────
  analysis-engine:
    build:
      # Repo root, so the build can reach shared/ as well as analysis-engine/
      context: .
      dockerfile: analysis-engine/Dockerfile
    container_name: sudarshan-analysis-engine
    env_file:
      - .env
      - analysis-engine/.env
    # NOT published. This service has no authentication of its own; the backend
    # reaches it as http://analysis-engine:8001 on the internal compose network.
    expose:
      - "8001"
    environment:
      - PYTHONPATH=/app:/opt/sudarshan-core
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5555
      - MOBSF_HOST=http://mobsf:8000
      - MOBSF_API_KEY=sudarshan_mobsf_api_key_2026
      # The engine now performs the analysis, so it needs the same AI
      # credentials the backend has. Without them ui_explorer and the agentic
      # planner import successfully but disable themselves, and exploration
      # silently degrades to the deterministic fallback planner.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - FRIDA_ANALYSIS_DURATION=${FRIDA_ANALYSIS_DURATION:-30}
      # Raise on a slow emulator: scales every UI action delay.
      - SUDARSHAN_ACTION_DELAY_SCALE=${SUDARSHAN_ACTION_DELAY_SCALE:-1.0}
      - SUDARSHAN_APP_OPEN_SETTLE=${SUDARSHAN_APP_OPEN_SETTLE:-8.0}
      - SUDARSHAN_FRIDA_PORT=${SUDARSHAN_FRIDA_PORT:-27055}
      - FRIDA_SERVER_PORT=${FRIDA_SERVER_PORT:-27055}
      - ANALYSIS_TIMEOUT_SECONDS=600
      - UPLOADS_DIR=/app/uploads
      - MITMPROXY_HAR_PATH=/mitmproxy_har/dump.har
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./analysis-engine:/app
      - ./shared:/opt/sudarshan-core
      - ./.env:/app/.env:ro
      - uploads:/app/uploads
      - ~/.android:/root/.android:ro
      - mitmproxy_har:/mitmproxy_har:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 4. mitmproxy Transparent HTTPS Proxy Sidecar ───────────────────────────
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: sudarshan-mitmproxy
    user: root
    # Publish only if an external AVD must reach the proxy. Prefer binding to
    # loopback so it is not exposed on the LAN.
    ports:
      - "127.0.0.1:8080:8080"    # Proxy port — point AVD to this
    command: >
      mitmdump
      --listen-host 0.0.0.0
      --listen-port 8080
      --set hardump=/har/dump.har
    volumes:
      - mitmproxy_har:/har
    restart: unless-stopped

  # ── 5. MobSF Mobile Security Framework Static Engine ────────────────────────
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: sudarshan-mobsf
    ports:
      - "8008:8000"
    environment:
      - MOBSF_API_KEY=sudarshan_mobsf_api_key_2026
    healthcheck:
      # /api_docs requires auth and may redirect (302/401), which fails curl -f.
      # The root URL (/) always returns 200 once Django is up — use that.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  uploads:         # Shared volume for zero-copy file sharing between backend & engine
  mitmproxy_har:   # Shared volume: mitmproxy writes HAR, engine reads it
