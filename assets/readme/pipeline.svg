<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Pipeline: decompile, detonate, correlate, score">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <path id="flow" d="M150 150 H1070"/>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="46" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">WHAT HAPPENS TO A SAMPLE</text>

    <!-- connectors -->
    <g stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrow)">
      <line x1="150" y1="150" x2="186" y2="150"/>
      <line x1="380" y1="150" x2="416" y2="150"/>
      <line x1="610" y1="150" x2="646" y2="150"/>
      <line x1="840" y1="150" x2="876" y2="150"/>
      <line x1="1070" y1="150" x2="1082" y2="150"/>
    </g>
    <circle r="3.5" fill="#2563eb">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#flow"/></animateMotion>
    </circle>

    <!-- input -->
    <rect x="40" y="118" width="110" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="95" y="146" text-anchor="middle" font-size="13" fill="#0f172a" font-family="'JetBrains Mono', Consolas, Menlo, monospace">sample.apk</text>
    <text x="95" y="166" text-anchor="middle" font-size="12" fill="#64748b">or a URL</text>

    <!-- stage cards -->
    <g>
      <rect x="190" y="80" width="190" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#2563eb;#e2e8f0;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="210" y="108" font-size="12" fill="#2563eb" font-family="'JetBrains Mono', Consolas, Menlo, monospace">01</text>
      <text x="210" y="136" font-size="18" font-weight="600" fill="#0f172a">Decompile</text>
      <text x="210" y="164" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">androguard · jadx</text>
      <text x="210" y="184" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">apktool · apk repair</text>
      <text x="210" y="204" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">bank clone check</text>
    </g>
    <g>
      <rect x="420" y="80" width="190" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#2563eb;#e2e8f0;#e2e8f0" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="440" y="108" font-size="12" fill="#2563eb" font-family="'JetBrains Mono', Consolas, Menlo, monospace">02</text>
      <text x="440" y="136" font-size="18" font-weight="600" fill="#0f172a">Detonate</text>
      <text x="440" y="164" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">android sandbox</text>
      <text x="440" y="184" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">frida hooks</text>
      <text x="440" y="204" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">ui explorer · mitm</text>
    </g>
    <g>
      <rect x="650" y="80" width="190" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#2563eb;#e2e8f0" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="670" y="108" font-size="12" fill="#2563eb" font-family="'JetBrains Mono', Consolas, Menlo, monospace">03</text>
      <text x="670" y="136" font-size="18" font-weight="600" fill="#0f172a">Correlate</text>
      <text x="670" y="164" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">virustotal · otx</text>
      <text x="670" y="184" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">abuseipdb</text>
      <text x="670" y="204" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">family rules · iocs</text>
    </g>
    <g>
      <rect x="880" y="80" width="190" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#e2e8f0;#e2e8f0;#2563eb" keyTimes="0;0.25;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="900" y="108" font-size="12" fill="#2563eb" font-family="'JetBrains Mono', Consolas, Menlo, monospace">04</text>
      <text x="900" y="136" font-size="18" font-weight="600" fill="#0f172a">Score</text>
      <text x="900" y="164" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">fixed formula</text>
      <text x="900" y="184" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">0–100 · safety floors</text>
      <text x="900" y="204" font-size="12" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">no AI in the verdict</text>
    </g>

    <!-- score ring, same style as the console header -->
    <g transform="translate(1128 150)">
      <circle r="34" fill="none" stroke="#e2e8f0" stroke-width="5"/>
      <circle r="34" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" transform="rotate(-90)"
              stroke-dasharray="213.6" stroke-dashoffset="213.6">
        <animate attributeName="stroke-dashoffset" values="213.6;213.6;8.5;8.5;213.6" keyTimes="0;0.75;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" font-family="'JetBrains Mono', Consolas, Menlo, monospace" opacity="0">96
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626" opacity="0">Critical
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="40" y="262" font-size="14" fill="#64748b">One sample in, one scored and evidence-backed case file out, usually within a few minutes.</text>
  </g>
</svg>
