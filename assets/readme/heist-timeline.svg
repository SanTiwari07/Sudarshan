<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Case reconstruction: how a banking trojan empties an account in 90 seconds">
  <rect x="0.5" y="0.5" width="1199" height="439" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- header -->
    <text x="40" y="46" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">CASE RECONSTRUCTION</text>
    <text x="40" y="72" font-size="20" font-weight="600" fill="#0f172a">From text message to empty account</text>
    <text x="1160" y="72" font-size="14" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace">elapsed 00:00 – 01:30</text>
    <line x1="40" y1="96" x2="1160" y2="96" stroke="#e2e8f0"/>

    <!-- spine -->
    <line x1="129" y1="124" x2="129" y2="400" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="129" y1="124" x2="129" y2="124" stroke="#0f172a" stroke-width="2">
      <animate attributeName="y2" values="124;400;400;124" keyTimes="0;0.8;0.96;1" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- rows: time | marker | event tag | description -->
    <g font-size="15" fill="#0f172a">
      <g opacity="0.25">
        <text x="40" y="129" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">00:00</text>
        <rect x="125" y="120" width="9" height="9" fill="#0f172a"/>
        <text x="160" y="129" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">SMS</text>
        <text x="330" y="129">“Your YONO KYC has expired. Update now:” and a link to an APK.</text>
        <animate attributeName="opacity" values="0.25;1;1;0.25" keyTimes="0;0.02;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="173" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">00:20</text>
        <rect x="125" y="164" width="9" height="9" fill="#0f172a"/>
        <text x="160" y="173" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">INSTALL</text>
        <text x="330" y="173">The app installs. Bank logo, bank colours, bank fonts.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.12;0.14;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="217" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">00:30</text>
        <rect x="125" y="208" width="9" height="9" fill="#d97706"/>
        <text x="160" y="217" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">ACCESSIBILITY</text>
        <text x="330" y="217">“Enable Accessibility protection.” The victim taps Allow.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.24;0.26;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="261" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">00:45</text>
        <rect x="125" y="252" width="9" height="9" fill="#d97706"/>
        <text x="160" y="261" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">PRIVILEGE</text>
        <text x="330" y="261">It grants itself overlay and SMS access, hides its icon, blocks uninstall.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.36;0.38;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="305" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">01:10</text>
        <rect x="125" y="296" width="9" height="9" fill="#dc2626"/>
        <text x="160" y="305" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">OVERLAY</text>
        <text x="330" y="305">The real bank app opens. A fake login drawn on top captures the MPIN.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.5;0.52;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="349" font-size="13" fill="#64748b" font-family="'JetBrains Mono', Consolas, Menlo, monospace">01:20</text>
        <rect x="125" y="340" width="9" height="9" fill="#dc2626"/>
        <text x="160" y="349" font-size="12" fill="#475569" font-family="'JetBrains Mono', Consolas, Menlo, monospace">SMS_RECEIVED</text>
        <text x="330" y="349">The bank's OTP arrives. It is forwarded to the attacker and hidden.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.64;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
      <g opacity="0.25">
        <text x="40" y="393" font-size="13" fill="#dc2626" font-weight="600" font-family="'JetBrains Mono', Consolas, Menlo, monospace">01:30</text>
        <rect x="125" y="384" width="9" height="9" fill="#dc2626"/>
        <text x="160" y="393" font-size="12" fill="#dc2626" font-weight="600" font-family="'JetBrains Mono', Consolas, Menlo, monospace">TRANSFER</text>
        <text x="330" y="393" fill="#dc2626" font-weight="600">Money leaves the account. The victim finds out days later.</text>
        <animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.78;0.8;0.96;1" dur="12s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
