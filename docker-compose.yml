services:
  # ── 1. Frontend Analyst Dashboard (React 18 SPA) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudarshan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # ── 2. Backend Gateway Orchestrator (FastAPI & Case Store) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudarshan-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8001
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5555
      - UPLOADS_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-sudarshan_jwt_secret_key_2026}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      analysis-engine:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. Analysis Engine Container (Ubuntu 24.04 + Java 17 + Python 3.12) ────
  analysis-engine:
    build:
      context: ./analysis-engine
      dockerfile: Dockerfile
    container_name: sudarshan-analysis-engine
    ports:
      - "8001:8001"
    environment:
      - ADB_HOST=host.docker.internal
      - ADB_PORT=5555
      - FRIDA_ANALYSIS_DURATION=30
      - ANALYSIS_TIMEOUT_SECONDS=300
      - UPLOADS_DIR=/app/uploads
      - MITMPROXY_HAR_PATH=/mitmproxy_har/dump.har
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./analysis-engine:/app
      - uploads:/app/uploads
      - ~/.android:/root/.android:ro
      - mitmproxy_har:/mitmproxy_har:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 4. mitmproxy Transparent HTTPS Proxy Sidecar ───────────────────────────
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: sudarshan-mitmproxy
    ports:
      - "8080:8080"    # Proxy port — point AVD to this
    command: >
      mitmdump
      --listen-host 0.0.0.0
      --listen-port 8080
      --set hardump=/har/dump.har
    volumes:
      - mitmproxy_har:/har
    restart: unless-stopped

volumes:
  uploads:         # Shared volume for zero-copy file sharing between backend & engine
  mitmproxy_har:   # Shared volume: mitmproxy writes HAR, engine reads it
