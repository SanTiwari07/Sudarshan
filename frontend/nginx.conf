server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when the browser accepts gzip.
    gzip_static on;

    # SPA catch-all: any path that does not match a real file is handed to
    # index.html so React Router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for content-addressed JS/CSS chunks (Vite hashes them).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for the HTML entry point so the browser always fetches the
    # latest chunk manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compact error pages.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
