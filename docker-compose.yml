services:
  # ── 1. Frontend Analyst Dashboard (React 18 SPA) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudarshan-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      # Force chokidar (Vite's file watcher) into polling mode on Windows/WSL2
      # bind-mount volumes. Without this, inotify events fail with EIO when
      # the /app bind-mount path becomes momentarily unavailable and crash the
      # entire Vite dev server process (Node.js uncaught FSWatcher error).
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # ── 2. Backend Gateway Orchestrator (FastAPI & Case Store) ─────────────────
  backend:
    build:
      # Repo root, so the build can reach shared/ as well as backend/
      context: .
      dockerfile: backend/Dockerfile
    container_name: sudarshan-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app:/opt/sudarshan-core
      - DATABASE_URL=${DATABASE_URL:-postgresql://sudarshan:sudarshan@postgres:5432/sudarshan}
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8001
      - MOBSF_HOST=http://mobsf:8000
      - MOBSF_API_KEY=${MOBSF_API_KEY:-sudarshan_mobsf_api_key_2026}
      - ANALYSIS_ENGINE_INTERNAL_TOKEN=${ANALYSIS_ENGINE_INTERNAL_TOKEN:-}
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-auto}
      # Genymotion exposes each VM at its own TCP endpoint on the host-only
      # network; it is not the Docker host's port 5555.
      - ADB_HOST=${ADB_HOST:-}
      - ADB_PORT=${ADB_PORT:-5555}
      - ADB_SERVER_SOCKET=${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}
      - DEVICE_SERIAL=${DEVICE_SERIAL:-${ANDROID_DEVICE_SERIAL:-}}
      - ANDROID_DEVICE_SERIAL=${ANDROID_DEVICE_SERIAL:-${DEVICE_SERIAL:-}}
      - ANDROID_SANDBOX_PROVIDER=${ANDROID_SANDBOX_PROVIDER:-${SANDBOX_PROVIDER:-auto}}
      - FRIDA_PORT=${FRIDA_PORT:-27055}
      - FRIDA_VERSION=${FRIDA_VERSION:-17.16.4}
      - AUTO_CONNECT=${AUTO_CONNECT:-true}
      - ROOT_REQUIRED=${ROOT_REQUIRED:-true}
      - UPLOADS_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_PRIMARY_API_KEY=${GEMINI_PRIMARY_API_KEY:-}
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-}
      - GEMINI_FALLBACK_API_KEY=${GEMINI_FALLBACK_API_KEY:-}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
      - GEMINI_PRIMARY_COOLDOWN_SECONDS=${GEMINI_PRIMARY_COOLDOWN_SECONDS:-60}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_RETRY_BASE_SECONDS=${GEMINI_RETRY_BASE_SECONDS:-0.5}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - ANALYSIS_TIMEOUT_SECONDS=1200
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      # Explicit, absolute, and on a named volume. Left unset it resolved
      # against the process CWD, which produced three unrelated sudarshan.db
      # files (backend/, repo root, analysis-engine/) and, under the hardened
      # overlay - read_only rootfs, dev bind-mount removed - pointed at
      # /app/sudarshan.db on an unwritable filesystem, so the container could
      # not start.
      - SUDARSHAN_DB_PATH=${SUDARSHAN_DB_PATH:-/app/data/sudarshan.db}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./shared:/opt/sudarshan-core
      - ./.env:/app/.env:ro
      - uploads:/app/uploads
      # The database lives on its own volume, not inside the source bind-mount,
      # so it survives `docker compose down`, image rebuilds, and the hardened
      # overlay removing ./backend:/app.
      #
      # Existing installs keep data in backend/sudarshan.db. That file is NOT
      # picked up automatically - a silent switch would make 13 cases vanish
      # from the UI. Move it once, deliberately:
      #     docker compose run --rm backend \
      #       python /opt/sudarshan-scripts/db_admin.py adopt /app/sudarshan.db
      # or from the host, with SUDARSHAN_DB_PATH pointed at the volume.
      # Pick up the banking baseline corpus
      - ./banking-baseline-corpus-main:/opt/banking-baseline-corpus-main:ro
      - dbdata:/app/data
      - ./scripts:/opt/sudarshan-scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      analysis-engine:
        condition: service_healthy
    restart: unless-stopped

  # ── 3. Analysis Engine Container (Ubuntu 24.04 + Java 17 + Python 3.12) ────
  analysis-engine:
    build:
      # Repo root, so the build can reach shared/ as well as analysis-engine/
      context: .
      dockerfile: analysis-engine/Dockerfile
    container_name: sudarshan-analysis-engine
    env_file:
      # The root .env carries every value this service needs. analysis-engine/.env
      # is an optional per-service override and is gitignored, so a fresh clone
      # does not have one. Declared as a plain string it is mandatory, and Compose
      # aborts the whole stack on a missing file - the "boots on my laptop, not
      # on yours" failure. required: false lets the override stay optional.
      - path: .env
        required: true
      - path: analysis-engine/.env
        required: false
    # NOT published. This service has no authentication of its own; the backend
    # reaches it as http://analysis-engine:8001 on the internal compose network.
    expose:
      - "8001"
    environment:
      - PYTHONPATH=/app:/opt/sudarshan-core
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-auto}
      # Preserve the configurable Genymotion endpoint from .env.
      - ADB_HOST=${ADB_HOST:-}
      - ADB_PORT=${ADB_PORT:-5555}
      - ADB_SERVER_SOCKET=${ADB_SERVER_SOCKET:-tcp:host.docker.internal:5037}
      - DEVICE_SERIAL=${DEVICE_SERIAL:-${ANDROID_DEVICE_SERIAL:-}}
      - ANDROID_DEVICE_SERIAL=${ANDROID_DEVICE_SERIAL:-${DEVICE_SERIAL:-}}
      - ANDROID_SANDBOX_PROVIDER=${ANDROID_SANDBOX_PROVIDER:-${SANDBOX_PROVIDER:-auto}}
      - FRIDA_PORT=${FRIDA_PORT:-27055}
      - FRIDA_VERSION=${FRIDA_VERSION:-17.16.4}
      # frida-server is ~106 MB (over GitHub's file limit) so tools/ is
      # gitignored. Pointing the cache at the bind-mounted host directory means
      # it is downloaded once per machine instead of once per container build -
      # the container's writable layer is discarded on every `--build`.
      - FRIDA_SERVER_DIR=${FRIDA_SERVER_DIR:-/opt/frida-cache}
      - AUTO_CONNECT=${AUTO_CONNECT:-true}
      - ROOT_REQUIRED=${ROOT_REQUIRED:-true}
      - MOBSF_HOST=http://mobsf:8000
      - MOBSF_API_KEY=${MOBSF_API_KEY:-sudarshan_mobsf_api_key_2026}
      - ANALYSIS_ENGINE_INTERNAL_TOKEN=${ANALYSIS_ENGINE_INTERNAL_TOKEN:-}
      # The engine now performs the analysis, so it needs the same AI
      # credentials the backend has. Without them ui_explorer and the agentic
      # planner import successfully but disable themselves, and exploration
      # silently degrades to the deterministic fallback planner.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_PRIMARY_API_KEY=${GEMINI_PRIMARY_API_KEY:-}
      - GEMINI_PRIMARY_MODEL=${GEMINI_PRIMARY_MODEL:-}
      - GEMINI_FALLBACK_API_KEY=${GEMINI_FALLBACK_API_KEY:-}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
      - GEMINI_PRIMARY_COOLDOWN_SECONDS=${GEMINI_PRIMARY_COOLDOWN_SECONDS:-60}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_RETRY_BASE_SECONDS=${GEMINI_RETRY_BASE_SECONDS:-0.5}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - OTX_API_KEY=${OTX_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      # 300s, matching frida_sandbox.py's ANALYSIS_DURATION_SECONDS default.
      # A measured exploration iteration costs ~14.8s (see .env), so the old 90s
      # default bought only 4-7 actions per sample and every run ended in
      # TIME_BUDGET_EXHAUSTED with unexplored work still in hand.
      # Exploration window. 300 was sized when the Gemini planner sat on the
      # critical path of every action (~12s each); it no longer does, so the
      # window does not have to absorb that latency. 120 keeps a whole scan -
      # static, launch, exploration, teardown - inside ~3-4 minutes.
      # Override in .env when a sample needs a longer walk.
      - FRIDA_ANALYSIS_DURATION=${FRIDA_ANALYSIS_DURATION:-130}
      # Raise on a slow sandbox: scales every UI action delay.
      - SUDARSHAN_ACTION_DELAY_SCALE=${SUDARSHAN_ACTION_DELAY_SCALE:-1.0}
      - SUDARSHAN_APP_OPEN_SETTLE=${SUDARSHAN_APP_OPEN_SETTLE:-8.0}
      - SUDARSHAN_FRIDA_PORT=${SUDARSHAN_FRIDA_PORT:-27055}
      - FRIDA_SERVER_PORT=${FRIDA_SERVER_PORT:-27055}
      - ANALYSIS_TIMEOUT_SECONDS=1200
      - MOBSF_SCAN_TIMEOUT_SECONDS=900
      - MOBSF_POLL_MAX_SECONDS=600
      - UPLOADS_DIR=/app/uploads
      - MITMPROXY_HAR_PATH=/mitmproxy_har/dump.har
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./analysis-engine:/app
      - ./shared:/opt/sudarshan-core
      - ./.env:/app/.env:ro
      - uploads:/app/uploads
      - ~/.android:/root/.android:ro
      # Host-side frida-server cache (see FRIDA_SERVER_DIR above). Writable on
      # purpose: the engine downloads the ABI-matched binary here on first use
      # and every later container reuses it.
      - ./tools:/opt/frida-cache
      - ./banking-baseline-corpus-main:/opt/banking-baseline-corpus-main:ro
      - mitmproxy_har:/mitmproxy_har:ro
    cpus: 2.0
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

    restart: unless-stopped

  # ── 4. mitmproxy Transparent HTTPS Proxy Sidecar ───────────────────────────
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: sudarshan-mitmproxy
    user: root
    # Publish only if an external sandbox must reach the proxy. Prefer binding to
    # loopback so it is not exposed on the LAN.
    ports:
      - "127.0.0.1:${MITMPROXY_PORT:-8085}:8080"    # Proxy port - point Genymotion/AVD to this
    command: >
      mitmdump
      --listen-host 0.0.0.0
      --listen-port 8080
      --set hardump=/har/dump.har
    volumes:
      - mitmproxy_har:/har
    restart: unless-stopped

  # ── 5. MobSF Mobile Security Framework Static Engine ────────────────────────
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: sudarshan-mobsf
    ports:
      - "127.0.0.1:8008:8000"
    environment:
      - MOBSF_API_KEY=${MOBSF_API_KEY:-sudarshan_mobsf_api_key_2026}
    healthcheck:
      # /api_docs requires auth and may redirect (302/401), which fails curl -f.
      # The root URL (/) always returns 200 once Django is up - use that.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ── 6. PostgreSQL Database (Production state) ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sudarshan-postgres
    environment:
      - POSTGRES_USER=sudarshan
      - POSTGRES_PASSWORD=sudarshan
      - POSTGRES_DB=sudarshan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudarshan"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:         # Shared volume for zero-copy file sharing between backend & engine
  mitmproxy_har:   # Shared volume: mitmproxy writes HAR, engine reads it
  dbdata:          # Authoritative application database (Legacy SQLite). Back up with scripts/db_admin.py backup
  pgdata:          # PostgreSQL data volume
