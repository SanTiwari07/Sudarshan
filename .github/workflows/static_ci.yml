name: Static Tests & Linting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f analysis-engine/requirements.txt ]; then pip install -r analysis-engine/requirements.txt; fi
          if [ -f shared/pyproject.toml ]; then pip install -e shared/ --no-deps; fi
          pip install pytest flake8

      - name: Run Python compile check
        # analysis-engine requires Frida/Android SDK at runtime; skip it here
        run: |
          python -m compileall -q backend shared

      # Exclude dynamic analysis tests which require Android emulator/Frida
      - name: Run Unit Tests
        env:
          PYTHONPATH: "backend:shared"
          JWT_SECRET_KEY: "ci_secret_key"
        run: |
          pytest tests/unit backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
